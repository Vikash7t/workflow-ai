services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workflow-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: workflow_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_ai"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - workflow_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workflow-ai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword123@postgres:5432/workflow_ai?schema=public
      ALLOWED_ORIGINS: http://localhost:3000
      BETTER_AUTH_SECRET: production_auth_secret_minimum_32_characters_long_for_security
      BETTER_AUTH_URL: http://localhost:4000
      METRICS_BEARER_TOKEN: internal_prometheus_secret_scrape_token_42
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - workflow_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: workflow-ai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - workflow_network

volumes:
  postgres_data:
    driver: local

networks:
  workflow_network:
    driver: bridge
